[project]
name = "lip-tvm2onnx"
version = "0.1.0"
description = "Convert a compatible TVM lip model to ONNX"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "mommysgoodpuppy" },
]
dependencies = [
    "numpy>=1.26,<3",
    "onnx>=1.16,<2",
    "onnxruntime>=1.20,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra -q"
pythonpath = ["src"]
testpaths = ["tests"]
